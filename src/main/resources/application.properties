spring.application.name=sistema-ingressos-api

# ===============================
# CONFIGURAÇÕES DO BANCO DE DADOS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_ingressos
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===============================
# Cria e atualiza as tabelas automaticamente com base nas suas Entidades
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no console (ótimo para ver o que está acontecendo por baixo dos panos)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true